<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>SocialCalc 0.8.1</title>
<script src="socialcalcconstants.js"></script>
<script src="socialcalc-3.js"></script>
<script src="socialcalctouch.js"></script>
<script src="socialcalctableeditor.js"></script>
<script src="formatnumber2.js"></script>
<script src="formula1.js"></script>
<script src="socialcalcpopup.js"></script>

<script src="socialcalcworkbook.js"></script>
<script src="socialcalcworkbookcontrol.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.3/jquery.min.js"></script>
<script src="Highcharts-2/js/highcharts.js"></script>
		
		<!-- 1a) Optional: add a theme file -->
		
			<script src="Highcharts-2/js/themes/gray.js"></script>
		
		
		<!-- 1b) Optional: the exporting module -->
		<script src="Highcharts-2/js/modules/exporting.js"></script>
		

<style>
body, td, input, textarea {
    font-family: verdana, helvetica, sans-serif;
    font-size: small;
}
.smaller {
    font-size: smaller;
}

/* Modern responsive design improvements */
body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

*, *::before, *::after {
    box-sizing: inherit;
}

#workbookControl {
    background-color: #80A9F3;
}

#tableeditor {
    margin: 8px 0 10px 0;
}

#msg {
    cursor: pointer;
}

.container {
    margin: 8px 0 10px 0;
}
</style>
</head>


<body style="background-color: #FFF;" onresize="spreadsheet.DoOnResize();">

<div id="workbookControl">
</div>

<div class="container">
 <div id="tableeditor">editor goes here</div>
</div>
 <div id="msg" onclick="this.innerHTML='&nbsp;';">&nbsp;</div>


<script>
 // Initialize SocialCalc constants
 SocialCalc.Constants.defaultGridCSS = "";

 // Initialize broadcast callback
 SocialCalc.Callbacks.broadcast = function(a, b) {
     // Placeholder for broadcast functionality
 };

 // Create spreadsheet control
 var spreadsheet = new SocialCalc.SpreadsheetControl();

 // Create and initialize workbook
 var workbook = new SocialCalc.WorkBook(spreadsheet);
 workbook.InitializeWorkBook("sheet1");

 // Initialize spreadsheet control and display
 spreadsheet.InitializeSpreadsheetControl("tableeditor");
 spreadsheet.ExecuteCommand('redisplay', '');

 // Create and initialize workbook control
 var workbookcontrol = new SocialCalc.WorkBookControl(workbook, "workbookControl", "sheet1");
 workbookcontrol.InitializeWorkBookControl();

 // Handle initial resize
 spreadsheet.DoOnResize();
</script>
</body>
</html>
