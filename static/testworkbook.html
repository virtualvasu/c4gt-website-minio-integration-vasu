<!--
playground to test multiple sheets in a page
-->
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="SocialCalc 0.8.1 - Test playground for multiple sheets">
	<title>SocialCalc 0.8.1</title>
	<script src="socialcalcconstants.js"></script>
	<script src="socialcalc-3.js"></script>
	<script src="socialcalctableeditor.js"></script>
	<script src="formatnumber2.js"></script>
	<script src="formula1.js"></script>
	<script src="socialcalcpopup.js"></script>
	<script src="socialcalcspreadsheetcontrol.js"></script>
	<script src="socialcalcworkbook.js"></script>
	<script src="socialcalcworkbookcontrol.js"></script>
	<script src="json2.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="highslide/highslide/highslide-with-html.js"></script>
	<link rel="stylesheet" href="highslide/highslide/highslide.css">

	<!-- Highslide configuration -->
	<script>
		hs.graphicsDir = 'highslide/highslide/graphics/';
		hs.outlineType = 'rounded-white';
		hs.showCredits = false;
		hs.wrapperClassName = 'draggable-header';
	</script>

	<style>
		body {
			font-family: Verdana, Helvetica, Arial, sans-serif;
			font-size: 14px;
			margin: 0;
			padding: 8px;
			background-color: #fff;
		}

		.container {
			max-width: none;
			margin: 0;
			padding: 0;
		}

		header {
			margin-bottom: 8px;
		}

		header h1 {
			margin: 0 0 4px 0;
			font-size: 18px;
		}

		header p {
			margin: 0 0 8px 0;
			font-size: 12px;
			color: #666;
		}

		#workbookControl {
			background-color: #80a9f3;
			border-radius: 4px;
			margin-bottom: 4px;
		}

		#tableeditor {
			margin: 0;
			border: 1px solid #ccc;
			border-radius: 4px;
			min-height: calc(100vh - 120px);
		}

		#msg {
			padding: 6px;
			cursor: pointer;
			background-color: #f5f5f5;
			border-radius: 4px;
			margin-top: 4px;
			font-size: 12px;
		}

		.smaller {
			font-size: 12px;
		}
	</style>
</head>

<body>
	<main>
		<div id="workbookControl" class="workbook-container" role="toolbar" aria-label="Workbook controls">
		</div>

		<div class="editor-container">
			<div id="tableeditor" class="table-editor" role="application" aria-label="Spreadsheet editor">
				editor goes here
			</div>
		</div>

		<div id="msg" class="message-area" onclick="this.innerHTML='&nbsp;';" role="status" aria-live="polite">
		</div>
	</main>

	<script>
		'use strict';

		// Initialize SocialCalc components
		SocialCalc.Callbacks.broadcast = function (a, b) {
			// Broadcast callback implementation
		};

		// Add missing CheckConstraints callback to prevent errors
		SocialCalc.Callbacks.CheckConstraints = function (editor, cellname, value) {
			// Constraint checking callback
			// Return true to allow the edit, false to reject it
			try {
				// Basic validation - ensure value is not undefined/null for certain cells
				if (value === undefined || value === null) {
					return true; // Allow empty values
				}
				
				// Add any custom constraint checking logic here
				// For example, restrict certain ranges or validate data types
				
				return true; // Allow all edits by default
			} catch (error) {
				console.warn('CheckConstraints error:', error);
				return true; // Allow edit on error to prevent blocking
			}
		};

		// Create spreadsheet and workbook instances
		const spreadsheet = new SocialCalc.SpreadsheetControl();
		const workbook = new SocialCalc.WorkBook(spreadsheet);

		// Initialize workbook with default sheet
		workbook.InitializeWorkBook("sheet1");

		// Initialize spreadsheet control
		spreadsheet.InitializeSpreadsheetControl("tableeditor");
		spreadsheet.ExecuteCommand('redisplay', '');

		// Create and initialize workbook control
		const workbookcontrol = new SocialCalc.WorkBookControl(workbook, "workbookControl", "sheet1");
		workbookcontrol.InitializeWorkBookControl();

		// Handle window resize events
		function handleResize() {
			if (spreadsheet && typeof spreadsheet.DoOnResize === 'function') {
				spreadsheet.DoOnResize();
			}
		}

		// Modern event listener instead of inline onresize
		window.addEventListener('resize', handleResize);
		window.addEventListener('load', handleResize);

		// Initial resize call
		handleResize();
	</script>
</body>

</html>
