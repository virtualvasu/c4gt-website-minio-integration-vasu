<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>{{ APP_TITLE }}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='screen.css') }}"
      type="text/css"
    />
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #333;
      }

      .top-bar {
        background: white;
        padding: 20px 30px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        border-bottom: 3px solid #2c3e50;
      }

      .top-bar h2 {
        margin: 0;
      }

      .top-bar h2 a {
        color: #2c3e50;
        text-decoration: none;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .top-bar h2 a:hover {
        color: #3498db;
      }

      .user-info {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 20px;
        margin-top: 8px;
        padding-top: 12px;
        border-top: 1px solid #ecf0f1;
      }

      .user-email {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #555;
        font-weight: 500;
      }

      .user-email::before {
        content: "👤";
        font-size: 16px;
      }

      .logout-btn {
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        color: white;
        border: none;
        padding: 8px 18px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
      }

      .logout-btn::before {
        content: "🚪";
        font-size: 14px;
      }

      .logout-btn:hover {
        background: linear-gradient(135deg, #2980b9 0%, #1f618d 100%);
        box-shadow: 0 4px 8px rgba(52, 152, 219, 0.4);
        transform: translateY(-1px);
      }

      .logout-btn:active {
        transform: translateY(0);
      }

      .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0;
      }

      .main-content {
        flex: 1;
        padding: 40px 0;
      }

      .footer-space {
        height: 20px;
      }

      hr {
        border: none;
        margin: 0;
      }

      hr.space {
        display: none;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="top-bar">
      <h2><a href="/">SocialCalc Collaborative Spreadsheet</a></h2>
      {% if session['user'] %}
      <div class="user-info">
        <span class="user-email">{{ session['user'] }}</span>
        <a href="/logout" class="logout-btn">Logout</a>
      </div>
      {% endif %}
    </div>

    <div class="container">
      <div class="main-content">
        {% block body %}{% endblock %} {% block bottom %}{% endblock %}
      </div>
      <div class="footer-space"></div>
    </div>
  </body>
</html>
